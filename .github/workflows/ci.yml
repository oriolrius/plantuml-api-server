name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check app tests

      - name: Format check (ruff)
        run: uv run ruff format --check app tests

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Tests (pytest)
        run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: plantuml-api-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8080:8080 plantuml-api-server:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"api_version"'
          curl -fsS http://localhost:8080/openapi.json | grep -q '"openapi":"3.1'
          docker rm -f api
